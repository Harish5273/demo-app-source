name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0)%4) $0=$0"="; print }' | base64 -d | jq '{sub, aud, iss}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::591424882000:role/gitops-platform-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push image
        run: |
          TAG=${GITHUB_SHA::7}
          docker build --build-arg GIT_SHA=$TAG -t ${{ vars.ECR_URI }}:$TAG .
          docker push ${{ vars.ECR_URI }}:$TAG
          echo "TAG=$TAG" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: Harish5273/gitops-platform-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Point the manifests repo at the new image
        run: |
          cd manifests
          sed -i "s|^  repository:.*|  repository: ${{ vars.ECR_URI }}|; s|^  tag:.*|  tag: \"$TAG\"|" demo-app/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "ci: deploy demo-app $TAG" || exit 0
          git push
